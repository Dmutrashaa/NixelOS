<style>
:root{color-scheme:dark;--background:#090a0e;--panel:rgba(17,18,24,.68);--border:rgba(255,255,255,.09);--text:#f5f5f7;--muted:#b9bbc7;--field:rgba(255,255,255,.06)}
:root[data-theme="light"]{color-scheme:light;--background:#f4f5fb;--panel:rgba(255,255,255,.72);--border:rgba(20,24,60,.12);--text:#14162a;--muted:#555a73;--field:rgba(20,24,60,.05)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--background);color:var(--text);font-family:"Comfortaa",system-ui,sans-serif;transition:background-color 300ms ease,color 300ms ease}
body{min-height:100vh;overflow-x:hidden;position:relative;padding-top:62px}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(520px 520px at 18% 22%,rgba(79,111,255,.2),transparent 70%),radial-gradient(460px 460px at 84% 70%,rgba(147,91,255,.18),transparent 70%),radial-gradient(380px 380px at 60% 10%,rgba(73,177,255,.12),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,-18px,0) scale(1.06)}}
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:10px clamp(14px,3.5vw,38px);background:var(--panel);border-bottom:1px solid var(--border);-webkit-backdrop-filter:blur(10px) brightness(.78);backdrop-filter:blur(7.5px) brightness(.78)}

.brand{display:inline-flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none}
.brand img{display:block;width:36px;height:36px;object-fit:contain;transition:transform 420ms cubic-bezier(.3,1.5,.5,1)}
.brand-name{font-size:17px;line-height:1;font-weight:700;letter-spacing:-.035em;white-space:nowrap}
.toplink{display:inline-flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:14px;font-weight:700;transition:color 180ms ease,transform 180ms ease}
.toplink:hover{color:#a8b4ff;transform:translateX(-3px)}
:root[data-theme="light"] .toplink:hover{color:#4a5bd8}
.toplink svg{width:20px;height:20px}
main{position:relative;z-index:1;width:min(520px,calc(100% - 28px));margin:0 auto;padding:clamp(28px,6vh,64px) 0 60px}
.card{width:100%;padding:clamp(20px,4vw,30px);border:1px solid rgba(133,151,255,.26);border-radius:22px;background:linear-gradient(135deg,rgba(91,111,255,.14),rgba(142,78,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 47px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(15px) saturate(135%);backdrop-filter:blur(15px) saturate(135%);animation:rise-in 800ms cubic-bezier(.2,.7,.2,1) both}
:root[data-theme="light"] .card{border-color:rgba(91,111,255,.32);background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(236,240,255,.7));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 16px 47px rgba(20,24,60,.12)}
.card+.card{margin-top:18px;animation-delay:120ms}
@keyframes rise-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
h1{margin:0 0 8px;font-size:clamp(24px,4vw,30px);line-height:1.3;letter-spacing:-.04em}
h2{margin:0 0 4px;font-size:18px;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted);font-size:15px;line-height:1.7}
.field{display:grid;gap:6px;margin-top:16px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--border);border-radius:12px;color:var(--text);background:var(--field);font:400 15px "Comfortaa",sans-serif;transition:border-color 180ms ease,box-shadow 180ms ease}
.field textarea{padding:12px 14px;min-height:92px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus{outline:none;border-color:rgba(151,166,255,.8);box-shadow:0 0 0 3px rgba(133,151,255,.22)}
.field input[readonly]{opacity:.7;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted)}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border:1px solid rgba(133,151,255,.32);border-radius:9px;color:#f7f7ff;text-decoration:none;font:700 14px "Comfortaa",sans-serif;background:linear-gradient(135deg,rgba(91,111,255,.17),rgba(142,78,255,.11));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 24px rgba(44,56,130,.12);-webkit-backdrop-filter:blur(15px) saturate(135%);backdrop-filter:blur(15px) saturate(135%);cursor:pointer;transition:transform 180ms ease,border-color 180ms ease,background 180ms ease,opacity 180ms ease}
:root[data-theme="light"] .btn{color:var(--text);border-color:rgba(91,111,255,.4);background:linear-gradient(135deg,rgba(91,111,255,.12),rgba(142,78,255,.08))}
.btn:hover{transform:translateY(-3px);border-color:rgba(151,166,255,.68);background:linear-gradient(135deg,rgba(91,111,255,.34),rgba(142,78,255,.27))}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-130%);transition:transform 650ms cubic-bezier(.2,.7,.2,1)}
.btn:hover::after{transform:translateX(130%)}
.btn:active{transform:translateY(-1px) scale(.97)}
.btn:focus-visible{outline:2px solid #a8b4ff;outline-offset:4px}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.block{width:100%;margin-top:22px}
.btn.ghost{background:var(--field);border-color:var(--border)}
.btn.danger:hover{border-color:rgba(255,120,120,.7);background:linear-gradient(135deg,rgba(255,90,90,.25),rgba(255,90,140,.18))}
.msg{margin:14px 0 0;padding:0 12px;max-height:0;overflow:hidden;border-radius:10px;font-size:13px;line-height:1.6;opacity:0;transition:max-height 300ms ease,opacity 300ms ease,padding 300ms ease}
.msg.on{max-height:160px;padding:10px 12px;opacity:1}
.msg.err{color:#ff9c9c;background:rgba(255,90,90,.12);border:1px solid rgba(255,120,120,.3)}
.msg.ok{color:#8ee6b0;background:rgba(60,200,120,.12);border:1px solid rgba(90,220,150,.3)}
:root[data-theme="light"] .msg.err{color:#b3261e}

.alt{margin:20px 0 0;text-align:center;color:var(--muted);font-size:14px}
.alt a{color:#b8c2ff;font-weight:700;text-decoration:none;padding-bottom:2px;background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size 320ms cubic-bezier(.2,.7,.2,1)}
.alt a:hover{background-size:100% 2px}
:root[data-theme="light"] .alt a{color:#4a5bd8}
.av-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
.av-lg{width:96px;height:96px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-size:38px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8f9bff,#a46bff);box-shadow:0 8px 28px rgba(120,110,255,.35);border:2px solid rgba(255,255,255,.18);transition:transform 320ms cubic-bezier(.3,1.5,.5,1)}
.av-lg:hover{transform:scale(1.05)}
.av-actions{display:flex;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;margin-top:2px;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.sep{height:1px;margin:24px 0;background:var(--border)}
@media(max-width:480px){body{padding-top:54px}.topbar{min-height:54px;padding:8px 14px}.brand img{width:31px;height:31px}.brand-name{font-size:16px}.btn.block{min-height:48px}}
@media(prefers-reduced-motion:reduce){.card,body::before{animation:none}.btn::after{display:none}}
.field .hint{margin-top:-2px}
.btn.ghost.block{margin-top:12px}
.btn.ghost.block[hidden]{display:none}
.mail{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:50%;color:#a8b4ff;background:rgba(133,151,255,.14);border:1px solid rgba(133,151,255,.32)}
.mail svg{width:30px;height:30px}
.center{text-align:center}
.sent-to{display:block;margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--field);border:1px solid var(--border);font-size:14px;font-weight:700;overflow-wrap:anywhere}

.top-actions{display:flex;align-items:center;gap:14px}
.menu-toggle,.menu-close{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--text);background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(8.5px);backdrop-filter:blur(8.5px);font:700 22px/1 "Comfortaa",sans-serif;cursor:pointer;transition:background 180ms ease,border-color 180ms ease,transform 220ms ease}
.menu-toggle:hover,.menu-close:hover{background:rgba(128,112,255,.16);border-color:rgba(150,140,255,.38)}
.menu-toggle:focus-visible,.menu-close:focus-visible{outline:2px solid #a8b4ff;outline-offset:3px}
.menu-toggle svg,.menu-close svg{width:22px;height:22px}
.menu-toggle .menu-icon{display:block;transition:transform 260ms cubic-bezier(.2,.7,.2,1)}
.menu-toggle[aria-expanded="true"] .menu-icon{transform:rotate(180deg)}
.menu-scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,10,.68);opacity:0;visibility:hidden;transition:opacity 280ms ease,visibility 280ms ease}
.menu-scrim.is-open{opacity:1;visibility:visible}
.side-menu{position:fixed;z-index:41;top:0;right:0;width:78vw;height:100dvh;overflow-y:auto;border-left:1px solid rgba(255,255,255,.14);background:rgba(20,22,35,.32);-webkit-backdrop-filter:blur(11px) saturate(160%) brightness(.72);backdrop-filter:blur(11px) saturate(160%) brightness(.72);box-shadow:-24px 0 68px rgba(0,0,0,.42);opacity:0;visibility:hidden;transform:translateX(105%);transition:transform 380ms cubic-bezier(.2,.75,.2,1),opacity 260ms ease,visibility 380ms;pointer-events:none;padding:22px}
.side-menu.is-open{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto}

.menu-head{display:flex;align-items:center;gap:12px}
.menu-head .menu-close{flex:none;margin-left:0}
.menu-account{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border:1px solid rgba(255,255,255,.15);border-radius:16px;color:var(--text,#f5f5f7);background:rgba(255,255,255,.08);text-decoration:none;transition:border-color 180ms ease,background 180ms ease,transform 180ms ease}
.menu-account:hover{border-color:rgba(151,166,255,.6);background:rgba(128,112,255,.16);transform:translateX(2px)}
.menu-av{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8f9bff,#a46bff);border:1px solid rgba(255,255,255,.18)}
.menu-av svg{width:22px;height:22px}
.menu-acc-text{min-width:0;display:grid;gap:2px}
.menu-acc-name{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:16px;font-weight:700;line-height:1.3}
.menu-acc-sub{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;color:var(--muted,#b9bbc7)}
.menu-acc-sub:empty{display:none}
.menu-links{display:grid;gap:2px;margin-top:30px}
.menu-link{display:flex;align-items:center;gap:14px;width:100%;padding:12px 6px;border-radius:10px;color:var(--text);text-decoration:none;font-size:18px;font-weight:700;transition:color 180ms ease,transform 180ms ease}
.menu-link svg{width:24px;height:24px;flex:0 0 auto;transition:transform 280ms cubic-bezier(.3,1.5,.5,1)}
.menu-link:hover,.menu-link[aria-current="page"]{color:#a8b4ff}
.menu-link:hover{transform:translateX(4px)}
.menu-theme{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:26px;padding:0 6px}
.menu-theme-label{font-size:16px;font-weight:700}
.theme-switch{position:relative;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;width:62px;height:34px;padding:0 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.08);cursor:pointer}
.theme-switch svg{width:16px;height:16px}
.theme-knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8f9bff,#a46bff);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform 280ms cubic-bezier(.2,.7,.2,1)}
.theme-switch[aria-checked="true"] .theme-knob{transform:translateX(28px)}
.menu-languages{margin-top:34px}
.lang-title{margin:0 0 16px;font-size:18px;line-height:1.45}
.lang-switch{position:relative;display:flex;align-items:center;width:100%;padding:3px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.06);container-type:inline-size}
.lang-thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:linear-gradient(135deg,#8f9bff,#a46bff);box-shadow:0 2px 12px rgba(120,110,255,.45)}
.lang-button{position:relative;z-index:1;flex:1 1 auto;min-width:0;min-height:36px;padding:0 6px;border:0;border-radius:999px;color:var(--muted);background:none;font:700 12px "Comfortaa",sans-serif;cursor:pointer}
.lang-button[aria-pressed="true"]{color:#fff}
:root[data-theme="light"] .menu-toggle,:root[data-theme="light"] .menu-close,:root[data-theme="light"] .menu-account,:root[data-theme="light"] .lang-switch,:root[data-theme="light"] .theme-switch{border-color:rgba(20,24,60,.16);background:rgba(20,24,60,.06)}
:root[data-theme="light"] .side-menu{border-left-color:rgba(20,24,60,.14);background:rgba(250,251,255,.8);box-shadow:-24px 0 68px rgba(20,24,60,.2)}
:root[data-theme="light"] .menu-link:hover,:root[data-theme="light"] .menu-link[aria-current="page"]{color:#4a5bd8}

</style>
  <style>
@keyframes rise-in {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: none; }
}

.reveal.is-visible,
.hero-logo.is-visible,
h1.is-visible,
.tagline.is-visible {
  animation: rise-in 800ms cubic-bezier(.2,.7,.2,1) forwards;
}

h1.is-visible { animation-delay: 160ms; }
.tagline.is-visible { animation-delay: 320ms; }

.os-card:nth-child(1).is-visible { animation-delay: 80ms; }
.os-card:nth-child(2).is-visible { animation-delay: 220ms; }
.os-card:nth-child(3).is-visible { animation-delay: 360ms; }
.social-section .social-intro.is-visible { animation-delay: 120ms; }
.social-section .social-actions.is-visible { animation-delay: 240ms; }

.reveal.reveal-auto { opacity: 0; transform: translateY(22px); animation: none; }
.reveal.reveal-auto.is-visible { animation: rise-in 800ms cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--reveal-delay, 0ms); }

.os-card,.status-card,.download-card,.news-card,.card,.req-card,.faq-panel{transition:translate 360ms cubic-bezier(.2,.7,.2,1),border-color 300ms ease,box-shadow 360ms ease}
.os-card:hover,.status-card:hover,.download-card:hover,.news-card:hover,.card:hover,.req-card:hover,.faq-panel:hover{translate:0 -5px;border-color:rgba(151,166,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 60px rgba(44,56,130,.3)}
:root[data-theme="light"] .os-card:hover,:root[data-theme="light"] .status-card:hover,:root[data-theme="light"] .download-card:hover,:root[data-theme="light"] .news-card:hover,:root[data-theme="light"] .card:hover,:root[data-theme="light"] .req-card:hover,:root[data-theme="light"] .faq-panel:hover{border-color:rgba(91,111,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 24px 60px rgba(44,56,130,.2)}

.btn:hover::after,.social-button:hover::after{transform:translateX(130%)}

.brand img{transition:transform 420ms cubic-bezier(.3,1.5,.5,1)}
.brand:hover img{transform:rotate(-8deg) scale(1.08)}
.menu-link svg{transition:transform 280ms cubic-bezier(.3,1.5,.5,1)}
.menu-link:hover svg{transform:scale(1.14) rotate(-4deg)}
.theme-switch{transition:border-color 200ms ease,background 200ms ease}
.theme-switch:hover{border-color:rgba(151,166,255,.6);background:rgba(133,151,255,.14)}
:root[data-theme="light"] .theme-switch:hover{border-color:rgba(91,111,255,.6);background:rgba(91,111,255,.14)}
.lang-switch.is-ready .lang-thumb{transition:transform 440ms cubic-bezier(.2,.8,.2,1.1),width 440ms cubic-bezier(.2,.8,.2,1.1)}
@media(prefers-reduced-motion:reduce){.os-card:hover,.status-card:hover,.download-card:hover,.news-card:hover,.card:hover,.req-card:hover,.faq-panel:hover{translate:none}.btn::after,.social-button::after{display:none}.lang-switch.is-ready .lang-thumb{transition:none}}

@media (prefers-reduced-motion: reduce) {

    transform: none;

.menu-toggle:active,.menu-close:active,.lang-button:active{transform:scale(.94)}

.users-grid>*:nth-child(3),.friends-grid>*:nth-child(3),.fr-grid>*:nth-child(3),.req-grid>*:nth-child(3),.faq-list>*:nth-child(3){animation-delay:140ms}

      navHome:"Главная", navDownloads:"Загрузки", navNews:"Новости", navMinReq:"Мин. требования", navFaq:"FAQ",
      navUsers:"Пользователи", navChat:"Чат ОС", navAccount:"Войти / Регистрация", themeLabel:"Светлая тема",
      langTitle:"Мы доступны на других языках!", openMenu:"Открыть меню", closeMenu:"Закрыть меню",
      back:"Назад на сайт", loginTitle:"Вход", loginSub:"С возвращением в NixelOS", fEmail:"Email", fPass:"Пароль",
      loginBtn:"Войти", bResend:"Отправить письмо ещё раз", noAcc:"Ещё нет аккаунта?", signUp:"Регистрация",
      regTitle:"Создать аккаунт", regSub:"Присоединяйся к сообществу NixelOS", fUser:"Имя пользователя",
      eUser:"Имя: 3–20 символов, буквы, цифры и _", fPass2:"Повторите пароль", regBtn:"Зарегистрироваться",
      haveAcc:"Уже есть аккаунт?", logIn:"Войти", ckTitle:"Проверьте почту",
      ckText:"На вашу электронную почту сейчас придёт письмо. Откройте ссылку и выйдите из неё, чтобы активировать ваш аккаунт. Далее входите со своим адресом и паролем, который вы выбрали.", ckBack:"Назад ко входу",
      vWaitT:"Проверяем почту…", vWaitX:"Одну секунду", vOkT:"Email подтверждён", vOkX:"Аккаунт активирован.",
      vProfile:"Открыть профиль", vExpT:"Ссылка устарела", vExpX:"Ссылка недействительна или срок её действия истёк.",
      vErrT:"Не удалось подтвердить email", vErrX:"Во время проверки что-то пошло не так.",
      vNoneT:"Нечего проверять", vNoneX:"Откройте ссылку подтверждения из письма."
    },
    uk: {
      navHome:"Головна", navDownloads:"Завантаження", navNews:"Новини", navMinReq:"Мін. вимоги", navFaq:"FAQ",
      navUsers:"Користувачі", navChat:"Чат ОС", navAccount:"Увійти / Реєстрація", themeLabel:"Світла тема",
      langTitle:"Ми доступні іншими мовами!", openMenu:"Відкрити меню", closeMenu:"Закрити меню",
      back:"Назад на сайт", loginTitle:"Вхід", loginSub:"З поверненням у NixelOS", fEmail:"Email", fPass:"Пароль",
      loginBtn:"Увійти", bResend:"Надіслати лист ще раз", noAcc:"Ще немає акаунта?", signUp:"Реєстрація",
      regTitle:"Створити акаунт", regSub:"Приєднуйся до спільноти NixelOS", fUser:"Ім'я користувача",
      eUser:"Ім'я: 3–20 символів, літери, цифри та _", fPass2:"Повторіть пароль", regBtn:"Зареєструватися",
      haveAcc:"Вже є акаунт?", logIn:"Увійти", ckTitle:"Перевірте пошту",
      ckText:"На вашу електронну пошту зараз прийде лист. Відкрийте посилання, та вийдіть з нього щоб активувати ваш акаунт. Далі входьте з своєю адресою та своїм паролем який ви обирали.", ckBack:"Назад до входу",
      vWaitT:"Перевіряємо пошту…", vWaitX:"Одну секунду", vOkT:"Email підтверджено", vOkX:"Акаунт активовано.",
      vProfile:"Відкрити профіль", vExpT:"Посилання застаріло", vExpX:"Посилання недійсне або термін його дії минув.",
      vErrT:"Не вдалося підтвердити email", vErrX:"Під час перевірки щось пішло не так.",
      vNoneT:"Нічого перевіряти", vNoneX:"Відкрийте посилання підтвердження з листа."
    }
  };
  let currentLang = "en";
  try { currentLang = localStorage.getItem("nixelos-lang") || "en"; } catch(e) {}
  if (!NAV_I18N[currentLang]) currentLang = "en";
  const menuToggle = document.getElementById("menu-toggle");
  const siteMenu = document.getElementById("site-menu");
  const menuScrim = document.getElementById("menu-scrim");
  const menuClose = document.getElementById("menu-close");
  function setMenuOpen(open) {
    if (!menuToggle || !siteMenu || !menuScrim) return;
    menuToggle.setAttribute("aria-expanded", String(open));
    siteMenu.classList.toggle("is-open", open);
    menuScrim.classList.toggle("is-open", open);
    siteMenu.setAttribute("aria-hidden", String(!open));
    siteMenu.toggleAttribute("inert", !open);
    menuScrim.setAttribute("aria-hidden", String(!open));
    document.body.style.overflow = open ? "hidden" : "";
  }
  if (menuToggle) menuToggle.addEventListener("click", () => setMenuOpen(menuToggle.getAttribute("aria-expanded") !== "true"));
  if (menuClose) menuClose.addEventListener("click", () => setMenuOpen(false));
  if (menuScrim) menuScrim.addEventListener("click", () => setMenuOpen(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && menuToggle && menuToggle.getAttribute("aria-expanded") === "true") setMenuOpen(false); });
  function applyBaseLang(lang) {
    if (!NAV_I18N[lang]) lang = "en";
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { const k = el.dataset.i18n; if (NAV_I18N[lang][k]) el.textContent = NAV_I18N[lang][k]; });
    document.querySelectorAll("[data-sk]").forEach(el => { const k = el.dataset.sk; if (NAV_I18N[lang][k]) el.textContent = NAV_I18N[lang][k]; });

  }
  const themeSwitch = document.getElementById("theme-switch");
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    if (themeSwitch) themeSwitch.setAttribute("aria-checked", String(theme === "light"));
  }
  applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");
  if (themeSwitch) themeSwitch.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    applyTheme(next);
    try { localStorage.setItem("nixelos-theme", next); } catch(e) {}
  });
  const langSwitch = document.querySelector(".lang-switch"), langThumb = document.querySelector(".lang-thumb");
  function moveThumb() {
    if (!langSwitch || !langThumb) return;
    const a = langSwitch.querySelector('.lang-button[aria-pressed="true"]');
    if (!a) return;
    langThumb.style.width = a.offsetWidth + "px";
    langThumb.style.transform = "translateX(" + a.offsetLeft + "px)";
  }
  if (langSwitch) {
    new MutationObserver(moveThumb).observe(langSwitch, { subtree: true, attributes: true, attributeFilter: ["aria-pressed"] });
    window.addEventListener("resize", moveThumb);
    document.querySelectorAll(".lang-button").forEach(btn => btn.addEventListener("click", () => {
      try { localStorage.setItem("nixelos-lang", btn.dataset.lang); } catch(e) {}
      nxLangSwap(btn.dataset.lang, function () { applyBaseLang(btn.dataset.lang); });
    }));
    applyBaseLang(currentLang);
    moveThumb();
    requestAnimationFrame(() => requestAnimationFrame(() => langSwitch.classList.add("is-ready")));

<script type="module">
let _mod = {}; try { _mod = await import("../JS/supabase.js?v=5"); } catch (e) {}
const {
  sb,
  t,
  initLang,
  mapErr,
  EMAIL_RE,
  verifyUrl,
  getSessionUser,
  registerDeviceSession
} = _mod;
if (!sb) { console.warn("Supabase offline"); }

if (initLang) initLang();

const form = document.getElementById("f");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");
const resend = document.getElementById("resend");

let cooldown = 0;
let timer = null;

function show(text, type = "err") {
  msg.className = "msg " + type + (text ? " on" : "");
  msg.textContent = text;
}

function tick() {
  if (cooldown > 0) {
    resend.disabled = true;
    resend.textContent = t("bResend") + " (" + cooldown + ")";
    cooldown--;
    timer = setTimeout(tick, 1000);
  } else {
    resend.disabled = false;
    resend.textContent = t("bResend");
  }
}

const blockedParam = new URLSearchParams(location.search).get("blocked") === "1";
if (blockedParam && t) {
  show(t("eDeviceBlocked"));
}
if (getSessionUser && await getSessionUser()) {
  location.replace("../comunicate/profile.html");
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  show("");
  resend.hidden = true;

  const email = form.email.value.trim();
  const password = form.pass.value;

  if (!email || !password) return show(t("eFill"));
  if (!EMAIL_RE.test(email) || email.length > 254) return show(t("eEmail"));

  btn.disabled = true;

  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      console.error("NixelOS LOGIN ERROR:", error);

      show(t(mapErr(error)));

      if (
        error.code === "email_not_confirmed" ||
        mapErr(error) === "eUnconf"
      ) {
        resend.hidden = false;
      }

      btn.disabled = false;
      return;
    }

    if (!data.user || !data.user.email_confirmed_at) {
      await sb.auth.signOut();
      show(t("eUnconf"));
      resend.hidden = false;
      btn.disabled = false;
      return;
    }

    if (registerDeviceSession) {
      const sres = await registerDeviceSession(data.user.id);
      if (sres && sres.blocked) {
        await sb.auth.signOut();
        show(t("eDeviceBlocked"));
        btn.disabled = false;
        return;
      }
    }

    location.href = "../comunicate/profile.html";

  } catch (e) {
    console.error("NixelOS LOGIN EXCEPTION:", e);
    show(t(mapErr(e)));
    btn.disabled = false;
  }
});

resend.addEventListener("click", async () => {
  const email = form.email.value.trim();

  if (!EMAIL_RE.test(email)) return show(t("eEmail"));

  resend.disabled = true;

  try {
    const { error } = await sb.auth.resend({
      type: "signup",
      email,
      options: {
        emailRedirectTo: verifyUrl()
      }
    });

    if (error) {
      console.error("NixelOS RESEND ERROR:", error);
      show(t(mapErr(error)));
      resend.disabled = false;
      return;
    }

    show(t("mResent"), "ok");

    clearTimeout(timer);
    cooldown = 60;
    tick();

  } catch (e) {
    console.error("NixelOS RESEND EXCEPTION:", e);
    show(t(mapErr(e)));
    resend.disabled = false;
  }
});
</script>
