<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0e">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>NixelOS — Users</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nixelos-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--background:#090a0e;--panel:rgba(17,18,24,.68);--border:rgba(255,255,255,.09);--text:#f5f5f7;--muted:#b9bbc7;--field:rgba(255,255,255,.06);--option-bg:#14162a}
:root[data-theme="light"]{color-scheme:light;--background:#f4f5fb;--panel:rgba(255,255,255,.72);--border:rgba(20,24,60,.12);--text:#14162a;--muted:#555a73;--field:rgba(20,24,60,.05);--option-bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--background);color:var(--text);font-family:"Comfortaa",system-ui,sans-serif;transition:background-color 300ms ease,color 300ms ease}
body{min-height:100vh;overflow-x:hidden;position:relative;padding-top:62px}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.78}
:root[data-theme="light"] #particles{opacity:.45}
.topbar,main{position:relative;z-index:1}
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:10px clamp(14px,3.5vw,38px);background:var(--panel);border-bottom:1px solid var(--border);-webkit-backdrop-filter:blur(10px) brightness(.78);backdrop-filter:blur(7.5px) brightness(.78)}
:root[data-theme="light"] .topbar{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand{display:inline-flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none}
.brand img{display:block;width:36px;height:36px;object-fit:contain;transition:transform 420ms cubic-bezier(.3,1.5,.5,1)}
.brand-name{font-size:17px;line-height:1;font-weight:700;letter-spacing:-.035em;white-space:nowrap}

/* Side menu */
.menu-toggle,.menu-close{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--text);background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(8.5px);backdrop-filter:blur(8.5px);font:700 22px/1 "Comfortaa",sans-serif;cursor:pointer;transition:background 180ms ease,border-color 180ms ease,transform 220ms ease}
.menu-toggle:hover,.menu-close:hover{background:rgba(128,112,255,.16);border-color:rgba(150,140,255,.38)}
.menu-toggle:focus-visible,.menu-close:focus-visible{outline:2px solid #a8b4ff;outline-offset:3px}
.menu-toggle svg,.menu-close svg{width:22px;height:22px}
.menu-toggle .menu-icon{display:block;transition:transform 260ms cubic-bezier(.2,.7,.2,1)}
.menu-toggle[aria-expanded="true"] .menu-icon{transform:rotate(180deg)}
.menu-scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,10,.68);opacity:0;visibility:hidden;transition:opacity 280ms ease,visibility 280ms ease}
.menu-scrim.is-open{opacity:1;visibility:visible}
.side-menu{position:fixed;z-index:41;top:0;right:0;width:78vw;height:100dvh;overflow-y:auto;border-left:1px solid rgba(255,255,255,.14);background:rgba(20,22,35,.32);-webkit-backdrop-filter:blur(11px) saturate(160%) brightness(.72);backdrop-filter:blur(11px) saturate(160%) brightness(.72);box-shadow:-24px 0 68px rgba(0,0,0,.42);opacity:0;visibility:hidden;transform:translateX(105%);transition:transform 380ms cubic-bezier(.2,.75,.2,1),opacity 260ms ease,visibility 380ms;pointer-events:none;padding:22px}
.side-menu.is-open{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto}
@media(min-width:769px){.side-menu{width:33.333vw}}
.menu-head{display:flex;align-items:center;gap:12px}
.menu-head .menu-close{flex:none;margin-left:0}
.menu-account{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border:1px solid rgba(255,255,255,.15);border-radius:16px;color:var(--text,#f5f5f7);background:rgba(255,255,255,.08);text-decoration:none;transition:border-color 180ms ease,background 180ms ease,transform 180ms ease}
.menu-account:hover{border-color:rgba(151,166,255,.6);background:rgba(128,112,255,.16);transform:translateX(2px)}
.menu-av{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8f9bff,#a46bff);border:1px solid rgba(255,255,255,.18)}
.menu-av svg{width:22px;height:22px}
.menu-acc-text{min-width:0;display:grid;gap:2px}
.menu-acc-name{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:16px;font-weight:700;line-height:1.3}
.menu-acc-name>span{margin-left:6px;vertical-align:-3px}
.menu-acc-sub{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;color:var(--muted,#b9bbc7)}
.menu-acc-sub:empty{display:none}
.menu-links{display:grid;gap:2px;margin-top:30px}
.menu-link{display:flex;align-items:center;gap:14px;width:100%;padding:12px 6px;border-radius:10px;color:var(--text);text-decoration:none;font-size:18px;font-weight:700;transition:color 180ms ease,transform 180ms ease}
.menu-link svg{width:24px;height:24px;flex:0 0 auto;transition:transform 280ms cubic-bezier(.3,1.5,.5,1)}
.menu-link:hover,.menu-link[aria-current="page"]{color:#a8b4ff}
.menu-link:hover{transform:translateX(4px)}
.menu-theme{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:26px;padding:0 6px}
.menu-theme-label{font-size:16px;font-weight:700}
.theme-switch{position:relative;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;width:62px;height:34px;padding:0 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.08);cursor:pointer}
.theme-switch svg{width:16px;height:16px}
.theme-knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8f9bff,#a46bff);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform 280ms cubic-bezier(.2,.7,.2,1)}
.theme-switch[aria-checked="true"] .theme-knob{transform:translateX(28px)}
.menu-languages{margin-top:34px}
.lang-title{margin:0 0 16px;font-size:18px;line-height:1.45}
.lang-switch{position:relative;display:flex;align-items:center;width:100%;padding:3px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.06);container-type:inline-size}
.lang-thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:linear-gradient(135deg,#8f9bff,#a46bff);box-shadow:0 2px 12px rgba(120,110,255,.45)}
.lang-button{position:relative;z-index:1;flex:1 1 auto;min-width:0;min-height:36px;padding:0 6px;border:0;border-radius:999px;color:var(--muted);background:none;font:700 12px "Comfortaa",sans-serif;cursor:pointer}
.lang-button[aria-pressed="true"]{color:#fff}
:root[data-theme="light"] .menu-toggle,:root[data-theme="light"] .menu-close,:root[data-theme="light"] .menu-account,:root[data-theme="light"] .lang-switch{border-color:rgba(20,24,60,.16);background:rgba(20,24,60,.06)}
:root[data-theme="light"] .side-menu{border-left-color:rgba(20,24,60,.14);background:rgba(250,251,255,.8);box-shadow:-24px 0 68px rgba(20,24,60,.2)}
:root[data-theme="light"] .menu-link:hover,:root[data-theme="light"] .menu-link[aria-current="page"]{color:#4a5bd8}
:root[data-theme="light"] .theme-switch{border-color:rgba(20,24,60,.2);background:rgba(20,24,60,.08)}

main{width:min(980px,calc(100% - 32px));margin:0 auto;padding:clamp(32px,6vh,68px) 0 60px;text-align:center}
.page-heading{margin:0;font-size:clamp(30px,5.8vw,50px);line-height:1.2;letter-spacing:-.05em;animation:rise-in 700ms cubic-bezier(.2,.7,.2,1) both}
.intro{max-width:660px;margin:14px auto 28px;color:var(--muted);font-size:clamp(14px,2.2vw,17px);line-height:1.75;animation:rise-in 700ms cubic-bezier(.2,.7,.2,1) 120ms both}
@keyframes rise-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;max-width:860px;margin:0 auto 26px;padding:14px;border:1px solid rgba(133,151,255,.26);border-radius:20px;background:linear-gradient(135deg,rgba(91,111,255,.12),rgba(142,78,255,.07));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:rise-in 700ms cubic-bezier(.2,.7,.2,1) 200ms both}
:root[data-theme="light"] .toolbar{border-color:rgba(91,111,255,.32);background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(236,240,255,.72))}
.search-wrap{position:relative;flex:1 1 260px;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:14px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search-input{width:100%;min-height:44px;padding:0 14px 0 42px;border:1px solid var(--border);border-radius:14px;color:var(--text);background:var(--field);font:400 14px "Comfortaa",sans-serif;transition:border-color 180ms ease,box-shadow 180ms ease}
.search-input:focus{outline:none;border-color:rgba(151,166,255,.8);box-shadow:0 0 0 3px rgba(133,151,255,.2)}

.u-tabs{display:flex;gap:6px;flex-wrap:wrap}
.u-tab{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--border);border-radius:12px;color:var(--muted);background:var(--field);font:700 13px "Comfortaa",sans-serif;cursor:pointer;transition:color 180ms ease,border-color 180ms ease,background 180ms ease}
.u-tab:hover{color:var(--text);border-color:rgba(151,166,255,.5)}
.u-tab[aria-selected="true"]{color:#fff;border-color:#a8b4ff;background:linear-gradient(135deg,#8f9bff,#a46bff)}
.u-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11px;background:rgba(255,95,115,.9);color:#fff}
.u-badge[hidden]{display:none}

.users-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:18px;text-align:left;animation:rise-in 700ms cubic-bezier(.2,.7,.2,1) 280ms both}
.user-card{display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(133,151,255,.26);border-radius:20px;background:linear-gradient(135deg,rgba(91,111,255,.13),rgba(142,78,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 40px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform 280ms cubic-bezier(.2,.7,.2,1),border-color 240ms ease,box-shadow 280ms ease}
.user-card:hover{transform:translateY(-4px);border-color:rgba(151,166,255,.62);box-shadow:0 20px 52px rgba(44,56,130,.28)}
:root[data-theme="light"] .user-card{border-color:rgba(91,111,255,.3);background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(236,240,255,.74));box-shadow:0 14px 40px rgba(20,24,60,.1)}

.uc-banner{position:relative;display:block;width:100%;height:96px;background:linear-gradient(135deg,#2a3578 0%,#52328c 55%,#1c254a 100%);border-bottom:1px solid var(--border);text-decoration:none}
.uc-banner::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 35%,rgba(143,155,255,.32),transparent 58%);pointer-events:none}
.uc-banner.has-banner::after{display:none}

.uc-body{display:flex;flex-direction:column;flex:1;padding:0 18px 18px}
.uc-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:-32px;margin-bottom:10px;position:relative;z-index:2}
.uc-av-link{text-decoration:none}
.uc-av{width:64px;height:64px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8f9bff,#a46bff);border:3px solid var(--background);box-shadow:0 6px 18px rgba(0,0,0,.38);transition:transform 220ms ease}
.uc-av-link:hover .uc-av{transform:scale(1.06)}

.uc-name-link{display:inline-flex;align-items:center;gap:6px;color:var(--text);text-decoration:none;font-size:17px;font-weight:700;line-height:1.3}
.uc-name-link:hover{color:#a8b4ff}
:root[data-theme="light"] .uc-name-link:hover{color:#4a5bd8}
.uc-handle{margin:2px 0 0;color:var(--muted);font-size:13px}
.uc-bio{margin:10px 0 14px;color:var(--muted);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.uc-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1 1 auto;min-height:38px;padding:0 12px;border:1px solid rgba(133,151,255,.34);border-radius:10px;color:#f7f7ff;text-decoration:none;font:700 12.5px "Comfortaa",sans-serif;background:linear-gradient(135deg,rgba(91,111,255,.22),rgba(142,78,255,.15));cursor:pointer;transition:transform 180ms ease,border-color 180ms ease,background 180ms ease}
:root[data-theme="light"] .btn{color:var(--text);border-color:rgba(91,111,255,.4);background:linear-gradient(135deg,rgba(91,111,255,.14),rgba(142,78,255,.08))}
.btn:hover{transform:translateY(-2px);border-color:rgba(151,166,255,.72);background:linear-gradient(135deg,rgba(91,111,255,.38),rgba(142,78,255,.28))}
.btn.ghost{background:var(--field);border-color:var(--border)}
.btn.ok{border-color:rgba(90,220,150,.48);background:linear-gradient(135deg,rgba(60,200,120,.24),rgba(40,160,100,.14))}
.btn.danger:hover{border-color:rgba(255,120,120,.7);background:linear-gradient(135deg,rgba(255,90,90,.25),rgba(255,90,140,.18))}
.btn svg{width:15px;height:15px;flex:none}
.empty-msg{grid-column:1/-1;padding:42px 16px;text-align:center;color:var(--muted);font-size:15px}

@media(max-width:480px){body{padding-top:54px}.topbar{min-height:54px;padding:8px 14px}.brand img{width:31px;height:31px}.brand-name{font-size:16px}main{padding:28px 0 50px}}

.nx-rules-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border:1px solid rgba(151,166,255,.38);border-radius:999px;color:var(--text,#f5f5f7);background:rgba(133,151,255,.12);font:700 12px "Comfortaa",sans-serif;cursor:pointer;transition:transform 180ms ease,border-color 180ms ease,background 180ms ease}
.nx-rules-btn:hover{transform:translateY(-2px);border-color:rgba(151,166,255,.75);background:rgba(133,151,255,.22)}
.nx-rules-btn svg{width:15px;height:15px;color:#a8b4ff;flex:none}
:root[data-theme="light"] .nx-rules-btn{border-color:rgba(91,111,255,.4);background:rgba(91,111,255,.1)}
:root[data-theme="light"] .nx-rules-btn svg{color:#4a5bd8}
.nx-rules-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(5,6,12,.68);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity 220ms ease,visibility 220ms ease}
.nx-rules-overlay.on{opacity:1;visibility:visible}
.nx-rules-box{width:min(520px,100%);max-height:88vh;overflow-y:auto;padding:clamp(20px,4vw,28px);text-align:left;border:1px solid rgba(151,166,255,.36);border-radius:22px;background:linear-gradient(135deg,rgba(28,31,56,.97),rgba(16,18,30,.98));box-shadow:0 24px 70px rgba(0,0,0,.5);transform:translateY(16px) scale(.97);transition:transform 260ms cubic-bezier(.2,.7,.2,1)}
.nx-rules-overlay.on .nx-rules-box{transform:none}
:root[data-theme="light"] .nx-rules-box{background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(238,242,255,.98));box-shadow:0 24px 70px rgba(20,24,60,.24)}
.nx-rules-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.nx-rules-top h3{margin:0;font-size:clamp(19px,3.2vw,23px);line-height:1.3;letter-spacing:-.03em}
.nx-rules-sub{margin:0 0 16px;color:var(--muted,#b9bbc7);font-size:13.5px;line-height:1.65}
.nx-rules-list{display:grid;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.nx-rules-item{padding:12px 14px;border:1px solid rgba(151,166,255,.22);border-left:3px solid #8f9bff;border-radius:6px 14px 14px 6px;background:rgba(255,255,255,.04)}
.nx-rules-item:nth-child(4){border-left-color:#ff7a8a;background:rgba(255,100,120,.07)}
:root[data-theme="light"] .nx-rules-item{background:rgba(91,111,255,.06);border-color:rgba(91,111,255,.22)}
:root[data-theme="light"] .nx-rules-item:nth-child(4){background:rgba(255,90,110,.09)}
.nx-rules-item strong{display:block;margin-bottom:4px;font-size:14.5px;color:var(--text,#f5f5f7)}
.nx-rules-item p{margin:0;font-size:13px;line-height:1.6;color:var(--muted,#b9bbc7)}
.nx-rules-foot{margin:0 0 16px;padding:10px 12px;border-radius:12px;background:rgba(133,151,255,.1);font-size:13px;font-weight:700;line-height:1.55;text-align:center;color:var(--text,#f5f5f7)}
.nx-rules-ok{width:100%}

</style>
  <style>
@keyframes rise-in {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: none; }
}

.reveal.is-visible,
.hero-logo.is-visible,
h1.is-visible,
.tagline.is-visible {
  animation: rise-in 800ms cubic-bezier(.2,.7,.2,1) forwards;
}

h1.is-visible { animation-delay: 160ms; }
.tagline.is-visible { animation-delay: 320ms; }

.os-card:nth-child(1).is-visible { animation-delay: 80ms; }
.os-card:nth-child(2).is-visible { animation-delay: 220ms; }
.os-card:nth-child(3).is-visible { animation-delay: 360ms; }
.social-section .social-intro.is-visible { animation-delay: 120ms; }
.social-section .social-actions.is-visible { animation-delay: 240ms; }

.reveal.reveal-auto { opacity: 0; transform: translateY(22px); animation: none; }
.reveal.reveal-auto.is-visible { animation: rise-in 800ms cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--reveal-delay, 0ms); }

.os-card,.status-card,.download-card,.news-card,.card,.req-card,.faq-panel{transition:translate 360ms cubic-bezier(.2,.7,.2,1),border-color 300ms ease,box-shadow 360ms ease}
.os-card:hover,.status-card:hover,.download-card:hover,.news-card:hover,.card:hover,.req-card:hover,.faq-panel:hover{translate:0 -5px;border-color:rgba(151,166,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 60px rgba(44,56,130,.3)}
:root[data-theme="light"] .os-card:hover,:root[data-theme="light"] .status-card:hover,:root[data-theme="light"] .download-card:hover,:root[data-theme="light"] .news-card:hover,:root[data-theme="light"] .card:hover,:root[data-theme="light"] .req-card:hover,:root[data-theme="light"] .faq-panel:hover{border-color:rgba(91,111,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 24px 60px rgba(44,56,130,.2)}
.btn,.social-button{position:relative;overflow:hidden;isolation:isolate}
.btn::after,.social-button::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-130%);transition:transform 650ms cubic-bezier(.2,.7,.2,1)}
.btn:hover::after,.social-button:hover::after{transform:translateX(130%)}
.btn:active,.social-button:active{transform:translateY(-1px) scale(.97)}
.telegram-note a,.news-note a{padding-bottom:2px;background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size 320ms cubic-bezier(.2,.7,.2,1),color 200ms ease}
.telegram-note a:hover,.news-note a:hover{background-size:100% 2px;text-decoration:none}
.build-image,.news-image{transition:filter 500ms ease}
.download-card:hover .build-image,.news-card:hover .news-image{filter:saturate(1.15) brightness(1.06)}
.brand img{transition:transform 420ms cubic-bezier(.3,1.5,.5,1)}
.brand:hover img{transform:rotate(-8deg) scale(1.08)}
.menu-link svg{transition:transform 280ms cubic-bezier(.3,1.5,.5,1)}
.menu-link:hover svg{transform:scale(1.14) rotate(-4deg)}
.theme-switch{transition:border-color 200ms ease,background 200ms ease}
.theme-switch:hover{border-color:rgba(151,166,255,.6);background:rgba(133,151,255,.14)}
:root[data-theme="light"] .theme-switch:hover{border-color:rgba(91,111,255,.6);background:rgba(91,111,255,.14)}
.lang-switch.is-ready .lang-thumb{transition:transform 440ms cubic-bezier(.2,.8,.2,1.1),width 440ms cubic-bezier(.2,.8,.2,1.1)}
@media(prefers-reduced-motion:reduce){.os-card:hover,.status-card:hover,.download-card:hover,.news-card:hover,.card:hover,.req-card:hover,.faq-panel:hover{translate:none}.btn::after,.social-button::after{display:none}.lang-switch.is-ready .lang-thumb{transition:none}}

@media (prefers-reduced-motion: reduce) {
  .hero-logo, h1, .tagline, .reveal, .os-card, .status-card {
    opacity: 1;
    transform: none;
    animation: none !important;
  }

const getLang = Supa.getLang || (() => {
  try { const l = sGet("nixelos-lang") || "en"; return ["en","ru","uk"].includes(l) ? l : "en"; } catch { return "en"; }
});

const t = key => {
  const l = getLang();
  if (EXTRA_I18N[l] && EXTRA_I18N[l][key]) return EXTRA_I18N[l][key];
  if (Supa.t) {
    const v = Supa.t(key);
    if (v && v !== key) return v;
  }
  return (EXTRA_I18N.en && EXTRA_I18N.en[key]) || key;
};

const applyLabels = (root = document) => {
  root.querySelectorAll("[data-sk]").forEach(el => {
    const v = t(el.dataset.sk);
    if (v && v !== el.dataset.sk) el.textContent = v;
  });
  root.querySelectorAll("[data-sp]").forEach(el => {
    const v = t(el.dataset.sp);
    if (v && v !== el.dataset.sp) el.placeholder = v;
  });
};

const initLang = () => {
  document.documentElement.lang = getLang();
  applyLabels();
};

const getMyProfile = async (uid) => {
  const read = () => sb.from("profiles").select("*").eq("id", uid).maybeSingle();
  let { data } = await read();
  if (!data) {
    const r = await sb.rpc("ensure_my_profile");
    if (!r.error) ({ data } = await read());
  }
  return data;
};

const bannerUrl = Supa.bannerUrl || (path => {
  if (!path) return null;
  if (/^https?:\/\//i.test(path)) return path;
  return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
});

const applyBannerStyle = Supa.applyBannerStyle || ((el, profile) => {
  if (!el) return;
  let bPath = profile && profile.banner_path;
  if (!bPath && profile && profile.id) { try { bPath = sGet("nixelos-banner-" + profile.id) || null; } catch (e) {} }
  const url = bannerUrl(bPath);
  if (url) {
    el.style.backgroundImage = `linear-gradient(180deg, rgba(9,10,14,.15) 0%, rgba(9,10,14,.55) 100%), url("${url.replace(/"/g, "%22")}")`;
    el.style.backgroundSize = "cover";
    el.style.backgroundPosition = "center";
    el.classList.add("has-banner");
  } else {
    el.style.backgroundImage = "";
    el.style.backgroundSize = "";
    el.style.backgroundPosition = "";
    el.classList.remove("has-banner");
  }
});

function applyAllLang(lang) {

  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {

const ICON_ADD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>';
const ICON_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

async function loadData() {
  meUser = await getSessionUser().catch(() => null);
  let usersData = null;
  try {
    const res = await sb.from("profiles").select("*").order("created_at", { ascending: false }).limit(200);
    usersData = res.data;
  } catch (e) {}
  allUsers = (usersData && usersData.length) ? usersData : [
    {
      id: "demo-nixel-dev",
      username: "nixel_dev",
      display_name: "NixelOS Developer",
      bio: "Building NixelOS & NXBoot bootloader 🚀",
      is_verified: true,
      is_moderator: true,
      created_at: "2026-10-15T10:00:00Z"
    }
  ];

  friendshipsMap = {};
  if (meUser) {
    const { data: fRows } = await sb.from("friendships")
      .select("id,requester_id,addressee_id,status")
      .or(`requester_id.eq.${meUser.id},addressee_id.eq.${meUser.id}`);
    (fRows || []).forEach(r => {
      const other = r.requester_id === meUser.id ? r.addressee_id : r.requester_id;
      friendshipsMap[other] = r;
    });
  }

  updateRequestBadge();
  renderUsers();
}

function updateRequestBadge() {
  const badgeEl = $("req-badge");
  if (!meUser) {
    badgeEl.hidden = true;
    return;
  }
  const incomingCount = Object.values(friendshipsMap).filter(r => r.status === "pending" && r.addressee_id === meUser.id).length;
  badgeEl.textContent = String(incomingCount);
  badgeEl.hidden = incomingCount === 0;
}

function buildFriendButton(u) {
  if (meUser && meUser.id === u.id) {
    const selfBtn = document.createElement("a");
    selfBtn.className = "btn ghost";
    selfBtn.href = "profile.html";
    selfBtn.textContent = t("pvEditOwn");
    return selfBtn;
  }

  if (!meUser) {
    const localKey = "nixelos-local-friend-" + (u.id || u.username);
    const isAdded = sGet(localKey) === "1";
    const fBtn = document.createElement("button");
    fBtn.type = "button";
    fBtn.className = isAdded ? "btn ok" : "btn";
    fBtn.innerHTML = isAdded ? `<span>${t("fFriends")}</span>` : (ICON_ADD + `<span>${t("fAddFriend")}</span>`);
    fBtn.addEventListener("click", () => {
      if (sGet(localKey) === "1") sDel(localKey);
      else sSet(localKey, "1");
      renderUsers();
    });
    return fBtn;
  }

  const fr = friendshipsMap[u.id];
  if (!fr) {
    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "btn";
    addBtn.innerHTML = ICON_ADD + `<span>${t("fAddFriend")}</span>`;
    addBtn.addEventListener("click", async () => {
      addBtn.disabled = true;
      const { data, error } = await sb.from("friendships")
        .insert({ requester_id: meUser.id, addressee_id: u.id, status: "pending" })
        .select("*")
        .single();
      if (!error && data) friendshipsMap[u.id] = data;
      else friendshipsMap[u.id] = { id: "local", requester_id: meUser.id, addressee_id: u.id, status: "pending" };
      updateRequestBadge();
      renderUsers();
    });
    return addBtn;
  }

  if (fr.status === "pending" && fr.requester_id === meUser.id) {
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "btn ghost";
    cancelBtn.textContent = t("fReqSent");
    cancelBtn.addEventListener("click", async () => {
      cancelBtn.disabled = true;
      await sb.from("friendships").delete().eq("id", fr.id);
      delete friendshipsMap[u.id];
      updateRequestBadge();
      renderUsers();
    });
    return cancelBtn;
  }

  if (fr.status === "pending" && fr.addressee_id === meUser.id) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;gap:6px;flex:1 1 auto";
    const accBtn = document.createElement("button");
    accBtn.type = "button";
    accBtn.className = "btn ok";
    accBtn.textContent = t("fAccept");
    accBtn.addEventListener("click", async () => {
      accBtn.disabled = true;
      const { data } = await sb.from("friendships").update({ status: "accepted" }).eq("id", fr.id).select("*").single();
      if (data) friendshipsMap[u.id] = data;
      updateRequestBadge();
      renderUsers();
    });
    const decBtn = document.createElement("button");
    decBtn.type = "button";
    decBtn.className = "btn ghost danger";
    decBtn.textContent = "✕";
    decBtn.title = t("fDecline");
    decBtn.style.flex = "0 0 auto";
    decBtn.addEventListener("click", async () => {
      decBtn.disabled = true;
      await sb.from("friendships").delete().eq("id", fr.id);
      delete friendshipsMap[u.id];
      updateRequestBadge();
      renderUsers();
    });
    wrap.append(accBtn, decBtn);
    return wrap;
  }

  const frBtn = document.createElement("button");
  frBtn.type = "button";
  frBtn.className = "btn ok";
  frBtn.textContent = t("fFriends");
  frBtn.title = t("fRemoveFriend");
  frBtn.addEventListener("click", async () => {
    frBtn.disabled = true;
    await sb.from("friendships").delete().eq("id", fr.id);
    delete friendshipsMap[u.id];
    updateRequestBadge();
    renderUsers();
  });
  return frBtn;
}

function renderUsers() {
  const grid = $("users-grid");
  grid.replaceChildren();
  const q = ($("search").value || "").trim().toLowerCase();

  const filtered = allUsers.filter(u => {
    if (q) {
      const dn = (u.display_name || "").toLowerCase();
      const un = (u.username || "").toLowerCase();
      if (!dn.includes(q) && !un.includes(q)) return false;
    }
    if (currentTab === "friends") {
      const fr = friendshipsMap[u.id];
      return fr && fr.status === "accepted";
    }
    if (currentTab === "requests") {
      const fr = friendshipsMap[u.id];
      return fr && fr.status === "pending";
    }
    return true;
  });

  if (!filtered.length) {
    const empty = document.createElement("p");
    empty.className = "empty-msg";
    empty.textContent = currentTab === "friends" ? t("fNoFriends") : currentTab === "requests" ? t("fNoRequests") : t("uEmpty");
    grid.append(empty);
    return;
  }

  filtered.forEach(u => {
    const profileHref = "profile-view.html?u=" + encodeURIComponent(u.username);
    const card = document.createElement("article");
    card.className = "user-card";

    const banner = document.createElement("a");
    banner.className = "uc-banner";
    banner.href = profileHref;
    banner.setAttribute("aria-label", u.display_name || u.username);
    applyBannerStyle(banner, u);

    const body = document.createElement("div");
    body.className = "uc-body";

    const top = document.createElement("div");
    top.className = "uc-top";
    const avLink = document.createElement("a");
    avLink.className = "uc-av-link";
    avLink.href = profileHref;
    avLink.append(makeAvatar(u, "uc-av"));
    top.append(avLink);

    const nameLink = document.createElement("a");
    nameLink.className = "uc-name-link";
    nameLink.href = profileHref;
    nameLink.textContent = u.display_name || u.username;
    if (u.is_verified) nameLink.append(badge());
    if (u.is_moderator) nameLink.append(modBadge());

    const handle = document.createElement("p");
    handle.className = "uc-handle";
    handle.textContent = "@" + u.username;

    const bio = document.createElement("p");
    bio.className = "uc-bio";
    bio.textContent = (u.bio && u.bio.trim()) ? u.bio : t("pvBioEmpty");

    const actions = document.createElement("div");
    actions.className = "uc-actions";
    const viewBtn = document.createElement("a");
    viewBtn.className = "btn ghost";
    viewBtn.href = profileHref;
    viewBtn.innerHTML = ICON_USER + `<span>${t("uViewProfile")}</span>`;
    actions.append(viewBtn, buildFriendButton(u));

    body.append(top, nameLink, handle, bio, actions);
    card.append(banner, body);
    grid.append(card);
  });
}

$("search").addEventListener("input", renderUsers);
document.querySelectorAll(".u-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    currentTab = tab.dataset.tab;
    document.querySelectorAll(".u-tab").forEach(x => x.setAttribute("aria-selected", String(x === tab)));
    renderUsers();
  });
});

loadData();
</script>
