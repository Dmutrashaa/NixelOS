<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --background: #090a0e;
      --panel: rgba(17, 18, 24, 0.68);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f5f5f7;
      --muted: #b9bbc7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: "Comfortaa", system-ui, sans-serif;
    }

    body { min-height: 100vh; overflow-x: hidden; position: relative; padding-top: 62px; }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: .78;
    }

    .topbar, main { position: relative; z-index: 1; }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 62px;
      padding: 10px clamp(14px, 3.5vw, 38px);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      -webkit-backdrop-filter: blur(10px) brightness(0.78);
      backdrop-filter: blur(7.5px) brightness(0.78);
      justify-content: space-between;
    }

    .menu-toggle {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      color: var(--text);
      background: rgba(255,255,255,.06);
      -webkit-backdrop-filter: blur(8.5px);
      backdrop-filter: blur(8.5px);
      font: 700 22px/1 "Comfortaa", sans-serif;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, transform 220ms ease;
    }
    .menu-toggle:hover { background: rgba(128,112,255,.16); border-color: rgba(150,140,255,.38); }
    .menu-toggle:focus-visible { outline: 2px solid #a8b4ff; outline-offset: 3px; }
    .menu-toggle .menu-icon { display: block; transition: transform 260ms cubic-bezier(.2,.7,.2,1); }
    .menu-toggle[aria-expanded="true"] .menu-icon { transform: rotate(180deg); }

    .menu-scrim {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(3, 4, 10, .68);
      opacity: 0;
      visibility: hidden;
      transition: opacity 280ms ease, visibility 280ms ease;
    }
    .menu-scrim.is-open { opacity: 1; visibility: visible; }

    .side-menu {
      position: fixed;
      z-index: 41;
      top: 0;
      right: 0;
      width: 78vw;
      height: 100dvh;
      border-left: 1px solid rgba(255,255,255,.14);
      background: rgba(20, 22, 35, .32);
      -webkit-backdrop-filter: blur(11px) saturate(160%) brightness(.72);
      backdrop-filter: blur(11px) saturate(160%) brightness(.72);
      box-shadow: -24px 0 68px rgba(0,0,0,.42);
      opacity: 0;
      visibility: hidden;
      transform: translateX(105%);
      transition: transform 380ms cubic-bezier(.2,.75,.2,1), opacity 260ms ease, visibility 380ms;
      pointer-events: none;
      padding: 22px;
    }
    @media (min-width: 769px) {
      .side-menu {
        width: 33.333vw;
      }
    }
    .side-menu.is-open { opacity: 1; visibility: visible; transform: translateX(0); pointer-events: auto; }

    .menu-close {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-left: auto;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      color: var(--text);
      background: rgba(255,255,255,.08);
      -webkit-backdrop-filter: blur(8.5px);
      backdrop-filter: blur(8.5px);
      font: 700 24px/1 "Comfortaa", sans-serif;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }
    .menu-close:hover { background: rgba(128,112,255,.2); transform: translateX(2px); }
    .menu-links { display: grid; gap: 12px; margin-top: 30px; }
    .menu-link { width: 100%; }
    .menu-languages { margin-top: 34px; }
    .menu-language-title { margin: 0 0 16px; font-size: 18px; line-height: 1.45; }
    .menu-close:focus-visible { outline: 2px solid #a8b4ff; outline-offset: 3px; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      display: block;
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-name {
      font-size: 17px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.035em;
      white-space: nowrap;
    }


.brand{color:inherit;text-decoration:none}
main{width:min(900px,calc(100% - 36px));margin:0 auto;padding:clamp(36px,7vh,76px) 0 60px;text-align:center}
.news-card{width:min(100%,690px);margin:0 auto;padding:clamp(20px,4vw,32px);text-align:left;overflow:hidden;border:1px solid rgba(133,151,255,.26);border-radius:22px;background:linear-gradient(135deg,rgba(91,111,255,.14),rgba(142,78,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 47px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(15px) saturate(135%);backdrop-filter:blur(15px) saturate(135%);opacity:0;transform:translateY(22px)}
.news-title{margin:0 0 12px;font-size:clamp(22px,3.8vw,30px);line-height:1.3;letter-spacing:-.04em}
.news-text{margin:0;color:var(--muted);font-size:clamp(15px,2.2vw,17px);line-height:1.8}
.news-image{display:block;width:100%;height:auto;margin:22px 0 18px;border:1px solid var(--border);border-radius:14px;background:#111522}
.news-meta{margin:0;color:var(--muted);font-size:13px}
.news-note{max-width:690px;margin:30px auto 0;color:var(--muted);font-size:14px;line-height:1.8;opacity:0;transform:translateY(22px)}
.news-note a{color:#b8c2ff;text-decoration:none;font-weight:700}
.news-note a:hover{text-decoration:underline}
.reveal.is-visible{animation:rise-in 800ms cubic-bezier(.2,.7,.2,1) forwards}
.news-note.is-visible{animation-delay:160ms}
@keyframes rise-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){body{padding-top:54px}.topbar{min-height:54px;padding:8px 14px}.brand img{width:31px;height:31px}.brand-name{font-size:16px}main{padding:36px 0 50px}}
@media(prefers-reduced-motion:reduce){.news-card,.news-note{opacity:1;transform:none;animation:none!important}}
  
:root{--option-bg:#14162a}
html,body{transition:background-color 300ms ease,color 300ms ease}
.menu-toggle svg,.menu-close svg{width:22px;height:22px}
.menu-links{gap:2px}
.menu-link{display:flex;align-items:center;gap:14px;width:100%;padding:12px 6px;border-radius:10px;color:var(--text);text-decoration:none;font-size:18px;font-weight:700;transition:color 180ms ease,transform 180ms ease}
.menu-link svg{width:24px;height:24px;flex:0 0 auto}
.menu-link:hover,.menu-link[aria-current="page"]{color:#a8b4ff}
.menu-link:hover{transform:translateX(4px)}
.menu-link:focus-visible{outline:2px solid #a8b4ff;outline-offset:2px}
.menu-theme{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:26px;padding:0 6px}
.menu-theme-label{font-size:16px;font-weight:700}
.theme-switch{position:relative;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;width:62px;height:34px;padding:0 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.08);cursor:pointer}
.theme-switch svg{width:16px;height:16px}
.theme-switch:focus-visible{outline:2px solid #a8b4ff;outline-offset:3px}
.theme-knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8f9bff,#a46bff);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform 280ms cubic-bezier(.2,.7,.2,1)}
.theme-switch[aria-checked="true"] .theme-knob{transform:translateX(28px)}
:root[data-theme="light"]{color-scheme:light;--background:#f4f5fb;--panel:rgba(255,255,255,.72);--border:rgba(20,24,60,.12);--text:#14162a;--muted:#555a73;--option-bg:#ffffff}
:root[data-theme="light"] #particles{opacity:.45}
:root[data-theme="light"] .topbar{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root[data-theme="light"] .menu-toggle,:root[data-theme="light"] .menu-close{border-color:rgba(20,24,60,.16);background:rgba(20,24,60,.06)}
:root[data-theme="light"] .menu-toggle:hover,:root[data-theme="light"] .menu-close:hover{border-color:rgba(91,111,255,.45);background:rgba(91,111,255,.14)}
:root[data-theme="light"] .menu-scrim{background:rgba(20,24,60,.38)}
:root[data-theme="light"] .side-menu{border-left-color:rgba(20,24,60,.14);background:rgba(250,251,255,.8);box-shadow:-24px 0 68px rgba(20,24,60,.2);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
:root[data-theme="light"] .menu-link:hover,:root[data-theme="light"] .menu-link[aria-current="page"]{color:#4a5bd8}
:root[data-theme="light"] .theme-switch{border-color:rgba(20,24,60,.2);background:rgba(20,24,60,.08)}
:root[data-theme="light"] .social-button,:root[data-theme="light"] .btn{color:var(--text);border-color:rgba(91,111,255,.4);background:linear-gradient(135deg,rgba(91,111,255,.12),rgba(142,78,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 24px rgba(44,56,130,.1)}
:root[data-theme="light"] .social-button:hover,:root[data-theme="light"] .btn:hover{border-color:rgba(91,111,255,.75);background:linear-gradient(135deg,rgba(91,111,255,.26),rgba(142,78,255,.2))}
:root[data-theme="light"] .os-card{border-color:rgba(20,24,60,.12);background:rgba(255,255,255,.72);box-shadow:0 16px 47px rgba(20,24,60,.1)}
:root[data-theme="light"] .status-card,:root[data-theme="light"] .download-card,:root[data-theme="light"] .news-card{border-color:rgba(91,111,255,.32);background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(236,240,255,.7));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 16px 47px rgba(20,24,60,.12)}
:root[data-theme="light"] .telegram-note a,:root[data-theme="light"] .news-note a{color:#4a5bd8}
:root[data-theme="light"] .build-select{border-color:rgba(91,111,255,.4);background:rgba(255,255,255,.75)}

::selection{background:rgba(143,155,255,.38);color:inherit}
html{scrollbar-width:thin;scrollbar-color:rgba(143,155,255,.5) transparent}
.os-card,.status-card,.download-card,.news-card{transition:translate 360ms cubic-bezier(.2,.7,.2,1),border-color 300ms ease,box-shadow 360ms ease}
.os-card:hover,.status-card:hover,.download-card:hover,.news-card:hover{translate:0 -5px;border-color:rgba(151,166,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 60px rgba(44,56,130,.3)}
:root[data-theme="light"] .os-card:hover,:root[data-theme="light"] .status-card:hover,:root[data-theme="light"] .download-card:hover,:root[data-theme="light"] .news-card:hover{border-color:rgba(91,111,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 24px 60px rgba(44,56,130,.2)}
.btn,.social-button{position:relative;overflow:hidden;isolation:isolate}
.btn::after,.social-button::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-130%);transition:transform 650ms cubic-bezier(.2,.7,.2,1)}
.btn:hover::after,.social-button:hover::after{transform:translateX(130%)}
.btn:active,.social-button:active{transform:translateY(-1px) scale(.97)}
.telegram-note a,.news-note a{padding-bottom:2px;background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size 320ms cubic-bezier(.2,.7,.2,1),color 200ms ease}
.telegram-note a:hover,.news-note a:hover{background-size:100% 2px;text-decoration:none}
.build-image,.news-image{transition:filter 500ms ease}
.download-card:hover .build-image,.news-card:hover .news-image{filter:saturate(1.15) brightness(1.06)}
.brand img{transition:transform 420ms cubic-bezier(.3,1.5,.5,1)}
.brand:hover img{transform:rotate(-8deg) scale(1.08)}
.menu-link svg{transition:transform 280ms cubic-bezier(.3,1.5,.5,1)}
.menu-link:hover svg{transform:scale(1.14) rotate(-4deg)}
.theme-switch{transition:border-color 200ms ease,background 200ms ease}
.theme-switch:hover{border-color:rgba(151,166,255,.6);background:rgba(133,151,255,.14)}
:root[data-theme="light"] .theme-switch:hover{border-color:rgba(91,111,255,.6);background:rgba(91,111,255,.14)}
.lang-switch{position:relative;display:flex;align-items:center;width:100%;padding:3px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(8.5px);backdrop-filter:blur(8.5px);container-type:inline-size}
.lang-thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:linear-gradient(135deg,#8f9bff,#a46bff);box-shadow:0 2px 12px rgba(120,110,255,.45)}
.lang-switch.is-ready .lang-thumb{transition:transform 440ms cubic-bezier(.2,.8,.2,1.1),width 440ms cubic-bezier(.2,.8,.2,1.1)}
.lang-button{position:relative;z-index:1;flex:1 1 auto;min-width:0;min-height:36px;padding:0 6px;border:0;border-radius:999px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);background:none;font:700 12px "Comfortaa",sans-serif;font-size:clamp(10px,calc(5.6cqw - 1.5px),13px);cursor:pointer;transition:color 260ms ease}
.lang-button:hover{color:var(--text)}
.lang-button[aria-pressed="true"]{color:#fff}
.lang-button:focus-visible{outline:2px solid #a8b4ff;outline-offset:-3px}
:root[data-theme="light"] .lang-switch{border-color:rgba(20,24,60,.16);background:rgba(20,24,60,.06)}
@media(prefers-reduced-motion:reduce){.os-card:hover,.status-card:hover,.download-card:hover,.news-card:hover{translate:none}.btn::after,.social-button::after{display:none}.lang-switch.is-ready .lang-thumb{transition:none}}
</style>
</head>

  <header class="topbar">

  </main>
  <script>
    const translations = {
      en: {navHome:"Home",navDownloads:"Downloads",navNews:"News",themeLabel:"Light theme",langTitle:"We are on other languages!",langGroup:"Language",openMenu:"Open menu",closeMenu:"Close menu",logoAlt:"NixelOS logo",newsTitle:"New Updated NXBoot 0.5 is here!",newsText:"Now, you can read FAT32 Files!",newsImgAlt:"NXBoot 0.5",posted:"Posted on: 15th October 2026 13:46",moreNews:"Wanna see more news? Check out on our",or:"or"},
      ru: {navHome:"Главная",navDownloads:"Загрузки",navNews:"Новости",themeLabel:"Светлая тема",langTitle:"Мы доступны на других языках!",langGroup:"Язык",openMenu:"Открыть меню",closeMenu:"Закрыть меню",logoAlt:"Логотип NixelOS",newsTitle:"Вышел обновлённый NXBoot 0.5!",newsText:"Теперь можно читать файлы FAT32!",newsImgAlt:"NXBoot 0.5",posted:"Опубликовано: 15 октября 2026, 13:46",moreNews:"Хотите больше новостей? Загляните в наш",or:"или"},
      uk: {navHome:"Головна",navDownloads:"Завантаження",navNews:"Новини",themeLabel:"Світла тема",langTitle:"Ми доступні іншими мовами!",langGroup:"Мова",openMenu:"Відкрити меню",closeMenu:"Закрити меню",logoAlt:"Логотип NixelOS",newsTitle:"Вийшов оновлений NXBoot 0.5!",newsText:"Тепер можна читати файли FAT32!",newsImgAlt:"NXBoot 0.5",posted:"Опубліковано: 15 жовтня 2026, 13:46",moreNews:"Хочеш більше новин? Заглянь у наш",or:"або"}
    };
    let currentLang = 'en';
    function t(key) {
      return (translations[currentLang] && translations[currentLang][key]) || translations.en[key];
    }
    function applyLang(lang) {
      if (!translations[lang]) lang = 'en';
      currentLang = lang;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
      document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.setAttribute('alt', t(el.dataset.i18nAlt)); });
      menuToggle.setAttribute('aria-label', menuToggle.getAttribute('aria-expanded') === 'true' ? t('closeMenu') : t('openMenu'));
      document.querySelectorAll('.lang-button').forEach(btn => { btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang)); });
    }
    let langBusy = false;
    let pendingLang = null;
    function setPressed(lang) {
      document.querySelectorAll('.lang-button').forEach(btn => { btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang)); });
    }
    function isRevealed(el) {
      const holder = el.closest('.reveal');
      return !holder || holder.classList.contains('is-visible');
    }
    async function switchLang(lang) {
      if (!translations[lang]) lang = 'en';
      if (lang === currentLang) return;
      if (langBusy) {
        pendingLang = lang;
        setPressed(lang);
        return;
      }
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const items = Array.from(document.querySelectorAll('[data-i18n]')).filter(isRevealed);
      if (reduceMotion || !items.length || typeof items[0].animate !== 'function') {
        applyLang(lang);
        return;
      }
      langBusy = true;
      setPressed(lang);
      const hidden = { opacity: 0, transform: 'translateY(-8px)', filter: 'blur(5px)' };
      const shown = { opacity: 1, transform: 'translateY(0)', filter: 'blur(0px)' };
      let outs = [];
      try {
        outs = items.map(el => el.animate([shown, hidden], { duration: 220, easing: 'ease-in', fill: 'forwards' }));
        await Promise.all(outs.map(a => a.finished));
        applyLang(lang);
        const ins = items.map((el, i) => el.animate(
          [{ opacity: 0, transform: 'translateY(10px)', filter: 'blur(5px)' }, shown],
          { duration: 460, delay: Math.min(i * 28, 340), easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'backwards' }
        ));
        outs.forEach(a => a.cancel());
        await Promise.all(ins.map(a => a.finished));
      } catch (e) {
        outs.forEach(a => a.cancel());
        applyLang(lang);
      } finally {
        langBusy = false;
        const next = pendingLang;
        pendingLang = null;
        if (next && next !== currentLang) switchLang(next);
      }
    }
    const menuToggle = document.getElementById('menu-toggle');
    const siteMenu = document.getElementById('site-menu');
    const menuScrim = document.getElementById('menu-scrim');
    const menuClose = document.getElementById('menu-close');
    function setMenuOpen(open) {
      menuToggle.setAttribute('aria-expanded', String(open));
      menuToggle.setAttribute('aria-label', open ? t('closeMenu') : t('openMenu'));
      siteMenu.classList.toggle('is-open', open);
      menuScrim.classList.toggle('is-open', open);
      siteMenu.setAttribute('aria-hidden', String(!open));
      siteMenu.toggleAttribute('inert', !open);
      menuScrim.setAttribute('aria-hidden', String(!open));
      document.body.style.overflow = open ? 'hidden' : '';
      if (open) menuClose.focus();
      else menuToggle.focus();
    }
    menuToggle.addEventListener('click', () => setMenuOpen(menuToggle.getAttribute('aria-expanded') !== 'true'));
    menuClose.addEventListener('click', () => setMenuOpen(false));
    menuScrim.addEventListener('click', () => setMenuOpen(false));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') setMenuOpen(false);
    });

    const revealItems = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
      const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      revealItems.forEach(item => revealObserver.observe(item));
    } else {
      revealItems.forEach(item => item.classList.add('is-visible'));
    }

    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let width = 0;
    let height = 0;
    const colors = ['79, 111, 255', '147, 91, 255', '73, 177, 255'];
    function resizeParticles() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(42, Math.max(18, Math.floor(width / 27)));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 2 + Math.random() * 5,
        vy: 0.12 + Math.random() * 0.38,
        vx: (Math.random() - 0.5) * 0.22,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 0.12 + Math.random() * 0.28
      }));
    }
    let animationFrame;
    function drawParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.y -= p.vy;
        p.x += p.vx;
        if (p.y < -15) { p.y = height + 15; p.x = Math.random() * width; }
        if (p.x < -15) p.x = width + 15;
        if (p.x > width + 15) p.x = -15;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 19;
        ctx.shadowColor = 'rgba(' + p.color + ', 0.9)';
        ctx.fillStyle = 'rgba(' + p.color + ', 0.65)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      animationFrame = requestAnimationFrame(drawParticles);
    }
    resizeParticles();
    drawParticles();
    window.addEventListener('resize', resizeParticles, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(animationFrame);
      else drawParticles();
    });
    document.querySelectorAll('.lang-button').forEach(btn => {
      btn.addEventListener('click', () => {
        switchLang(btn.dataset.lang);
        try { localStorage.setItem('nixelos-lang', btn.dataset.lang); } catch (e) {}
      });
    });
    let savedLang = 'en';
    try { savedLang = localStorage.getItem('nixelos-lang') || 'en'; } catch (e) {}
    applyLang(savedLang);
  
const themeSwitch=document.getElementById('theme-switch');
function applyTheme(theme){document.documentElement.dataset.theme=theme;themeSwitch.setAttribute('aria-checked',String(theme==='light'));const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',theme==='light'?'#f4f5fb':'#090a0e')}
applyTheme(document.documentElement.dataset.theme==='light'?'light':'dark');
themeSwitch.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='light'?'dark':'light';applyTheme(next);try{localStorage.setItem('nixelos-theme',next)}catch(e){}});

const langSwitch=document.querySelector('.lang-switch'),langThumb=document.querySelector('.lang-thumb');
function moveThumb(){const a=langSwitch.querySelector('.lang-button[aria-pressed="true"]');if(!a)return;langThumb.style.width=a.offsetWidth+'px';langThumb.style.transform='translateX('+a.offsetLeft+'px)'}
new MutationObserver(moveThumb).observe(langSwitch,{subtree:true,attributes:true,attributeFilter:['aria-pressed']});
if('ResizeObserver'in window)new ResizeObserver(moveThumb).observe(langSwitch);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveThumb);
window.addEventListener('resize',moveThumb);
moveThumb();
requestAnimationFrame(()=>requestAnimationFrame(()=>langSwitch.classList.add('is-ready')));
</script>
